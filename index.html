<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Journal</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        #calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            max-width: 600px;
        }

        .day {
            background: #222;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            border-radius: 5px;
            user-select: none;
        }

        .green {
            background-color: green;
        }

        .red {
            background-color: red;
        }

        .blank {
            background-color: #333;
        }

        #monthYear {
            margin: 10px 0;
        }

        button {
            margin: 0 10px;
            padding: 5px 10px;
        }

        #modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #222;
            padding: 20px;
            border: 1px solid white;
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        #modal input {
            padding: 5px;
        }
    </style>
</head>

<body>
    <h1>Trading Journal</h1>
    <div id="monthYear"></div>
    <div>
        <button onclick="prevMonth()">Previous</button>
        <button onclick="nextMonth()">Next</button>
    </div>
    <div id="calendar"></div>

    <div id="modal">
        <div id="modalDate"></div>
        <label>Number of Trades:</label>
        <input type="number" id="tradesInput">
        <label>P&L ($):</label>
        <input type="number" id="pnlInput">
        <button onclick="saveEntry()">Save</button>
        <button onclick="closeModal()">Close</button>
    </div>

    <script>
        const calendar = document.getElementById('calendar');
        const monthYear = document.getElementById('monthYear');
        const modal = document.getElementById('modal');
        const tradesInput = document.getElementById('tradesInput');
        const pnlInput = document.getElementById('pnlInput');
        const modalDate = document.getElementById('modalDate');

        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        let journalData = JSON.parse(localStorage.getItem('journalData')) || {};
        let selectedDate = '';

        function renderCalendar(month, year) {
            calendar.innerHTML = '';
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            monthYear.textContent = `${new Date(year, month).toLocaleString('default', { month: 'long' })} ${year}`;

            for (let i = 0; i < firstDay; i++) {
                const empty = document.createElement('div');
                calendar.appendChild(empty);
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dateKey = `${year}-${month + 1}-${i}`;
                const entry = journalData[dateKey];

                const day = document.createElement('div');
                day.className = 'day';
                if (entry) {
                    day.classList.add(entry.pnl >= 0 ? 'green' : 'red');
                } else {
                    day.classList.add('blank');
                }
                day.textContent = i;
                day.onclick = () => openModal(dateKey, entry);

                calendar.appendChild(day);
            }
        }

        function openModal(date, entry) {
            selectedDate = date;
            modalDate.textContent = date;
            tradesInput.value = entry ? entry.trades : '';
            pnlInput.value = entry ? entry.pnl : '';
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        function saveEntry() {
            journalData[selectedDate] = {
                trades: parseInt(tradesInput.value),
                pnl: parseFloat(pnlInput.value)
            };
            localStorage.setItem('journalData', JSON.stringify(journalData));
            closeModal();
            renderCalendar(currentMonth, currentYear);
        }

        function prevMonth() {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar(currentMonth, currentYear);
        }

        function nextMonth() {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            renderCalendar(currentMonth, currentYear);
        }

        renderCalendar(currentMonth, currentYear);
    </script>
</body>

</html>
